# Change prefix to Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Enable fast key response
set -s escape-time 0

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window
bind c new-window -c "#{pane_current_path}"

# Reload config quickly
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Use vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable mouse (optional but useful)
set -g mouse on

set -g status-left ""
set -g status-right ""
set -g status-style bg=default
set -g window-status-style bg=default,fg=brightblack
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g window-status-current-style bg=default,fg=yellow
set -g set-titles on
set -g set-titles-string "#T"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -as terminal-features ",*:RGB"
